<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Tile: deep glossy azure, lit from the top left -->
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#3D8BFF"/>
      <stop offset="0.45" stop-color="#1A5FD6"/>
      <stop offset="1" stop-color="#0B1F4D"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#9FD0FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9FD0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000A24" stop-opacity="0.45"/>
    </linearGradient>
    <!-- Globe: a glassy sphere -->
    <radialGradient id="globe" cx="0.34" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#F2FAFF"/>
      <stop offset="0.18" stop-color="#A9DBFF"/>
      <stop offset="0.5" stop-color="#3D8BFF"/>
      <stop offset="0.82" stop-color="#143C9E"/>
      <stop offset="1" stop-color="#0A2466"/>
    </radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9FFF4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7FE0C0" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#020A26" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#020A26" stop-opacity="0"/>
    </radialGradient>
    <!-- Orbit: polished gold tube -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B36B00"/>
      <stop offset="0.3" stop-color="#FFE38A"/>
      <stop offset="0.5" stop-color="#FFF6D2"/>
      <stop offset="0.7" stop-color="#FFC92E"/>
      <stop offset="1" stop-color="#C98400"/>
    </linearGradient>
    <linearGradient id="planeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D6E4FF"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur8" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="tileClip"><rect width="512" height="512" rx="116"/></clipPath>
    <clipPath id="ball"><circle cx="256" cy="258" r="128"/></clipPath>
    <clipPath id="front"><rect x="0" y="258" width="512" height="300"/></clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect width="512" height="512" fill="url(#tile)"/>
    <rect width="512" height="512" fill="url(#tileGlow)"/>

    <!-- soft shadow the globe casts on the tile -->
    <ellipse cx="270" cy="410" rx="150" ry="34" fill="url(#shadow)"/>

    <!-- far half of the orbit, behind the globe -->
    <g transform="rotate(-22 256 258)">
      <ellipse cx="256" cy="258" rx="212" ry="68" fill="none" stroke="#9A6400" stroke-width="18" stroke-opacity="0.9"/>
    </g>

    <!-- the globe -->
    <circle cx="256" cy="258" r="128" fill="url(#globe)"/>
    <g clip-path="url(#ball)">
      <!-- continents, catching the light -->
      <path d="M170 196c18-24 52-36 78-28 18 6 14 26-2 34-14 7-10 22 6 28 18 7 14 30-8 34-24 4-30 26-50 30-22 4-40-18-42-44-2-22 4-40 18-54z" fill="url(#land)"/>
      <path d="M282 160c26-6 58 6 76 28 10 12-2 22-16 18-16-4-28 6-22 20 6 16 30 18 34 38 4 22-16 46-40 50-20 3-22-18-14-34 8-17-6-30-22-34-18-5-24-24-14-42 5-24 6-40 18-44z" fill="url(#land)"/>
      <path d="M300 336c18-6 40 0 48 14 6 12-8 24-26 24-20 0-36-28-22-38z" fill="url(#land)"/>
      <!-- meridians -->
      <g fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3">
        <ellipse cx="256" cy="258" rx="56" ry="128"/>
        <ellipse cx="256" cy="258" rx="104" ry="128"/>
        <path d="M128 258H384M136 200H376M136 316H376"/>
      </g>
      <!-- dark limb at the lower right, a cool rim light at the edge -->
      <circle cx="300" cy="300" r="150" fill="none" stroke="#06164A" stroke-opacity="0.35" stroke-width="60" filter="url(#blur8)"/>
    </g>
    <circle cx="256" cy="258" r="126" fill="none" stroke="#BFE3FF" stroke-opacity="0.55" stroke-width="3"/>
    <!-- specular highlight -->
    <ellipse cx="210" cy="190" rx="58" ry="34" transform="rotate(-28 210 190)" fill="url(#spec)" opacity="0.85"/>
    <circle cx="190" cy="176" r="10" fill="#FFFFFF" opacity="0.9" filter="url(#blur3)"/>

    <!-- near half of the orbit, in front -->
    <g transform="rotate(-22 256 258)" clip-path="url(#front)">
      <ellipse cx="256" cy="258" rx="212" ry="68" fill="none" stroke="#5A3500" stroke-opacity="0.35" stroke-width="20" transform="translate(0 6)" filter="url(#blur3)"/>
      <ellipse cx="256" cy="258" rx="212" ry="68" fill="none" stroke="url(#gold)" stroke-width="20"/>
      <ellipse cx="256" cy="255" rx="212" ry="66" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="3"/>
    </g>

    <!-- the plane riding the orbit -->
    <g transform="rotate(-22 256 258) translate(256 258) translate(162 42) rotate(-17) scale(1.3)">
      <path d="M38 0C38 -3 35 -5 30 -5L10 -5L-8 -32L-18 -32L-6 -5L-24 -5L-31 -15L-38 -15L-34 0L-38 15L-31 15L-24 5L-6 5L-18 32L-8 32L10 5L30 5C35 5 38 3 38 0Z" fill="#061640" opacity="0.45" transform="translate(4 7)" filter="url(#blur3)"/>
      <path d="M38 0C38 -3 35 -5 30 -5L10 -5L-8 -32L-18 -32L-6 -5L-24 -5L-31 -15L-38 -15L-34 0L-38 15L-31 15L-24 5L-6 5L-18 32L-8 32L10 5L30 5C35 5 38 3 38 0Z" fill="url(#planeFill)"/>
    </g>

    <!-- glass: a curved gloss across the top and a bevelled edge -->
    <path d="M0 0H512V196C392 236 120 236 0 176Z" fill="url(#gloss)"/>
  </g>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="url(#bevel)" stroke-width="6"/>
</svg>
